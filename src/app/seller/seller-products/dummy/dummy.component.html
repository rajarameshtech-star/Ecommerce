<mat-dialog-content>
    <h1 mat-dialog-title>{{data.title}}</h1>
    <p mat-dialog-content>{{data.message}}</p>
</mat-dialog-content>
<mat-dialog-actions>
    <button mat-flat-button (click)="onCancel()">Cancel</button>
    <button mat-button color="red" (click)="onConfirm()">Delete</button>
</mat-dialog-actions>
