<p mat-dialog-title>New Product</p>
<mat-dialog-content>
    <form [formGroup]="newProduct">
        <mat-form-field appearance="fill">
        <mat-label>Product Name</mat-label>
        <input matInput formControlName="productTitle" />
        </mat-form-field>
    
        <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <textarea matInput formControlName="productDescription"></textarea>
        </mat-form-field>
    
        <mat-form-field appearance="fill">
        <mat-label>Price</mat-label>
        <input matInput type="number" formControlName="price" />
        </mat-form-field>
    
        <mat-form-field appearance="fill">
        <mat-label>Stock Quantity</mat-label>
        <input matInput type="number" formControlName="quantity" />
        </mat-form-field>
    
        <div class="image-upload">
        <label for="fileInput">Upload Image:</label>
        <input type="file" id="fileInput" (change)="onFileSelected('a')" />
        <!-- <div *ngIf="imagePreview">
            <p>Image Preview:</p>
            <img [src]="" alt="Image Preview" class="preview-image"/>
        </div> -->
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions class="actions">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-button color="primary" (click)="onCreate()" [disabled]="!newProduct.valid">Create</button>
</mat-dialog-actions>
