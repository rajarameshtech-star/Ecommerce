<div class="card h-100 product-card">
  <div [routerLink]="['/products',product().id]">
  <div class="product-image-container">
    <img [src]="product().productImage" class="card-img-top product-image" alt="{{product().productTitle}}">
  </div>
  <div class="card-body d-flex flex-column">
    <h5 class="card-title">{{product().productTitle}}</h5>
    <p class="card-text flex-grow-1">{{product().productDescription}}</p>
    <p class="card-text price">{{product().price | currency}}</p>
  </div>
</div>
  <div class="card-footer">
    @if(this.qty() == 0) {
      <button class="btn btn-primary w-100" (click)="addProductToCart()">Add to Cart</button>
    } 
    @if(this.qty()> 0 ) {
      <div class="input-group">
        <button class="btn btn-outline-secondary" (click)="decrement()">-</button>
        <input type="text" class="form-control text-center" [value]="this.qty()" readonly>
        <button class="btn btn-outline-secondary" (click)="increment()">+</button>
        <button class="btn btn-outline-danger ms-2" (click)="removeFromCart()">
          <i class="bi bi-trash"></i>
        </button>
      </div>
    }
  </div>
</div>
