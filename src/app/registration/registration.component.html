<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h3 class="text-center">Register</h3>
                </div>
                <div class="card-body">
                    <form #registerForm="ngForm" (ngSubmit)="onSubmit(registerForm)">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" [(ngModel)]="email" required email>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" [(ngModel)]="password" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Roles</label>
                            @for(role of available_roles; track role) {
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" (change)="selectedRoles[role]= !selectedRoles[role]" [id]="role">
                                    <label class="form-check-label" [for]="role">{{role}}</label>
                                </div>
                            }
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <small>Already have an account? <a routerLink="/login">Login here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
