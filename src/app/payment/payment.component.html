<div class="container mt-5">
    <h2>Select a Payment Method</h2>
    <div class="list-group">
      <label class="list-group-item">
        <input class="form-check-input me-1" type="radio" name="paymentMethod" value="COD" (change)="selectPaymentMethod('COD')">
        Cash on Delivery (COD)
      </label>
      <label class="list-group-item">
        <input class="form-check-input me-1" type="radio" name="paymentMethod" value="UPI" (change)="selectPaymentMethod('UPI')">
        UPI
      </label>
      @if (paymentMethod() === 'UPI') {
        <div class="mt-2">
          <input type="text" class="form-control" placeholder="Enter VPA" [(ngModel)]="paymentDetails.vpa">
        </div>
      }
      <label class="list-group-item">
        <input class="form-check-input me-1" type="radio" name="paymentMethod" value="DebitCard" (change)="selectPaymentMethod('DebitCard')">
        Debit Card
      </label>
      @if (paymentMethod() === 'DebitCard') {
        <div class="mt-2">
          <input type="text" class="form-control mb-1" placeholder="Card Number" [(ngModel)]="paymentDetails.cardNumber">
          <input type="text" class="form-control mb-1" placeholder="CVV" [(ngModel)]="paymentDetails.cvv">
          <input type="text" class="form-control" placeholder="Expiry (MM/YY)" [(ngModel)]="paymentDetails.expiry">
        </div>
      }
      <label class="list-group-item">
        <input class="form-check-input me-1" type="radio" name="paymentMethod" value="CreditCard" (change)="selectPaymentMethod('CreditCard')">
        Credit Card
      </label>
      @if (paymentMethod() === 'CreditCard') {
        <div class="mt-2">
          <input type="text" class="form-control mb-1" placeholder="Card Number" [(ngModel)]="paymentDetails.cardNumber">
          <input type="text" class="form-control mb-1" placeholder="CVV" [(ngModel)]="paymentDetails.cvv">
          <input type="text" class="form-control" placeholder="Expiry (MM/YY)" [(ngModel)]="paymentDetails.expiry">
        </div>
      }
      <label class="list-group-item">
        <input class="form-check-input me-1" type="radio" name="paymentMethod" value="Wallet" (change)="selectPaymentMethod('Wallet')">
        Wallet
      </label>
      @if (paymentMethod() === 'Wallet') {
        <div class="mt-2">
          <input type="text" class="form-control" placeholder="Wallet ID" [(ngModel)]="paymentDetails.walletId">
        </div>
      }
    </div>
    <div class="mt-3">
      <button class="btn btn-success" (click)="submitPayment()" [disabled]="!paymentMethod()">Confirm Payment</button>
    </div>
  </div>
