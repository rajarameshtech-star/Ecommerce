<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <img [src]="product?.productImage" class="img-fluid" alt="{{product?.productTitle}}">
        </div>
        <div class="col-md-6">
            <h2>{{product?.productTitle}}</h2>
            <p>{{product?.productDescription}}</p>
            <h3>{{product?.price | currency}}</h3>
            <p>In stock: {{product?.quantity}}</p>
            <div class="d-flex">
                <input type="number" class="form-control me-2" value="1" min="1" [max]="product?.quantity">
                <button class="btn btn-primary">Add to Cart</button>
            </div>
            <hr>
            <h4>Reviews</h4>
            @for(review of product?.reviews; track $index){
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Rating: <span [innerHTML]="multiply(review.rating)"></span></h5>
                        <p class="card-text">{{review.review}}</p>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
